
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTest Pro - Plataforma de Evaluación IA</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Puter.js (IA) -->
    <script src="https://js.puter.com/v2/"></script>
    
    <!-- SheetJS (Excel Export) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <!-- Fuentes: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth,
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore,
            collection,
            addDoc,
            onSnapshot,
            doc,
            deleteDoc,
            getDocs
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración de Firebase
        const myFirebaseConfig = {
            apiKey: "AIzaSyDmzF3Td-dPxPtkr1X69pE-oNcdaMQLAoI",
            authDomain: "pruebas-2-f7033.firebaseapp.com",
            databaseURL: "https://pruebas-2-f7033-default-rtdb.firebaseio.com",
            projectId: "pruebas-2-f7033",
            storageBucket: "pruebas-2-f7033.firebasestorage.app",
            messagingSenderId: "287419005795",
            appId: "1:287419005795:web:39a8618a4d725d0d6a7156",
            measurementId: "G-75T54PE8WE"
        };

        let db, auth, currentUser;
        let quizzes = [];
        let allResults = [];

        window.appState = {
            view: "init",
            currentQuiz: null,
            studentName: "",
            studentEarned: 0,
            urlPin: null
        };

        const getAppId = () => typeof __app_id !== "undefined" ? __app_id : "produccion-edutest";

        // Inicialización de Firebase
        const initFirebase = async () => {
            let configToUse = myFirebaseConfig;
            if (typeof __firebase_config !== "undefined" && __firebase_config) {
                configToUse = JSON.parse(__firebase_config);
            }

            try {
                const app = initializeApp(configToUse);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (user) setupDatabaseListeners();
                });

            } catch (error) {
                console.error("Error iniciando Firebase:", error);
                showToast("Error crítico al conectar con el servidor.", "error");
            }
        };

        const setupDatabaseListeners = () => {
            if (!currentUser) return;

            const appId = getAppId();
            const quizzesRef = collection(db, "artifacts", appId, "public", "data", "quizzes");
            const resultsRef = collection(db, "artifacts", appId, "public", "data", "results");

            onSnapshot(quizzesRef, (snapshot) => {
                quizzes = [];
                snapshot.forEach((docItem) => {
                    quizzes.push({ id: docItem.id, ...docItem.data() });
                });
                updateViewOnDataLoad();
            }, (error) => console.error(error));

            onSnapshot(resultsRef, (snapshot) => {
                allResults = [];
                snapshot.forEach((docItem) => {
                    allResults.push({ id: docItem.id, ...docItem.data() });
                });
                if (window.appState.view === "teacher_dashboard") renderTeacherDashboard();
                
                // Si el modal de resultados está abierto, se actualiza en vivo
                const modal = document.getElementById('results-modal');
                if (modal && window.currentViewedQuizId) {
                    window.viewResults(window.currentViewedQuizId, window.currentViewedQuizTopic, true);
                }
            }, (error) => console.error(error));
        };

        const updateViewOnDataLoad = () => {
            if (window.appState.view === "loading_student") startStudentView();
            if (window.appState.view === "teacher_dashboard") renderTeacherDashboard();
        };

        window.navigate = (view) => {
            window.appState.view = view;
            render();
        };

        const checkRouting = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const pin = urlParams.get("pin");

            if (pin) {
                window.appState.urlPin = pin.toUpperCase();
                window.navigate("loading_student");
            } else {
                window.navigate("teacher_login");
            }
        };

        const render = () => {
            const container = document.getElementById("app-content");
            container.innerHTML = "";

            switch (window.appState.view) {
                case "teacher_login": renderTeacherLogin(container); break;
                case "teacher_dashboard": 
                    renderTeacherDashboardHTML(container); 
                    renderTeacherDashboard(); 
                    break;
                case "loading_student": renderLoadingStudent(container); break;
                case "student_name": renderStudentName(container); break;
                case "taking_quiz": renderTakingQuiz(container); break;
                case "quiz_result": renderQuizResult(container); break;
            }
            
            lucide.createIcons();
        };

        /* ================= VISTAS HTML ================= */

        const renderTeacherLogin = (container) => {
            container.innerHTML = `
                <div class="max-w-md mx-auto mt-20 p-1 animate-fade-in">
                    <div class="bg-white p-8 rounded-3xl shadow-2xl shadow-indigo-100 border border-slate-100">
                        <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-indigo-200">
                            <i data-lucide="shield-check" class="text-white w-8 h-8"></i>
                        </div>
                        <h2 class="text-3xl font-extrabold text-slate-800 mb-2 tracking-tight">Acceso Docente</h2>
                        <p class="text-slate-500 mb-8">Ingresa tus credenciales para administrar las evaluaciones.</p>

                        <div class="relative mb-6">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="lock" class="w-5 h-5 text-slate-400"></i>
                            </div>
                            <input
                                type="password"
                                id="teacher-pwd"
                                class="w-full pl-11 pr-4 py-4 rounded-xl bg-slate-50 border-transparent focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all text-slate-700"
                                placeholder="Contraseña de acceso"
                                onkeypress="if(event.key === 'Enter') window.loginTeacher()"
                            >
                        </div>

                        <button
                            onclick="window.loginTeacher()"
                            class="w-full bg-slate-900 hover:bg-indigo-600 text-white font-semibold py-4 px-4 rounded-xl transition-all duration-300 shadow-md hover:shadow-xl hover:-translate-y-0.5 flex items-center justify-center gap-2">
                            <span>Ingresar al Sistema</span>
                            <i data-lucide="arrow-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            `;
        };

        const renderTeacherDashboardHTML = (container) => {
            container.innerHTML = `
                <div class="max-w-7xl mx-auto animate-fade-in grid grid-cols-1 lg:grid-cols-12 gap-8">
                    
                    <!-- Panel Izquierdo: Generador IA -->
                    <div class="lg:col-span-5 space-y-6">
                        <div class="bg-white p-8 rounded-3xl shadow-xl shadow-indigo-100/50 border border-slate-100 sticky top-6">
                            <div class="flex items-center gap-4 mb-8">
                                <div class="bg-gradient-to-tr from-indigo-500 to-violet-500 p-3 rounded-xl shadow-lg shadow-indigo-200">
                                    <i data-lucide="bot" class="text-white w-6 h-6"></i>
                                </div>
                                <div>
                                    <h2 class="text-2xl font-extrabold text-slate-800">Generador IA</h2>
                                    <p class="text-sm text-slate-500 font-medium">Crea pruebas al instante</p>
                                </div>
                            </div>

                            <div class="space-y-5">
                                <div>
                                    <label class="block text-slate-700 text-sm font-semibold mb-2">Tema de evaluación</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i data-lucide="book-open" class="w-5 h-5 text-slate-400"></i>
                                        </div>
                                        <input id="quiz-topic" type="text" class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all text-sm" placeholder="Ej. Ecuaciones cuadráticas">
                                    </div>
                                </div>

                                <div class="grid grid-cols-3 gap-4">
                                    <div>
                                        <label class="block text-slate-700 text-sm font-semibold mb-2" title="Cantidad de preguntas">Preguntas</label>
                                        <div class="relative">
                                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                <i data-lucide="hash" class="w-4 h-4 text-slate-400"></i>
                                            </div>
                                            <input id="quiz-count" type="number" min="1" max="30" value="10" class="w-full pl-9 pr-2 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all text-sm">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-slate-700 text-sm font-semibold mb-2" title="Puntaje Total de la Prueba">Pts Totales</label>
                                        <div class="relative">
                                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                <i data-lucide="star" class="w-4 h-4 text-amber-500"></i>
                                            </div>
                                            <input id="quiz-total-points" type="number" min="1" max="1000" value="100" class="w-full pl-9 pr-2 py-3 rounded-xl bg-amber-50 border border-amber-200 focus:bg-white focus:border-amber-500 focus:ring-2 focus:ring-amber-200 transition-all text-sm font-bold text-amber-700">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-slate-700 text-sm font-semibold mb-2">Dificultad</label>
                                        <select id="quiz-level" class="w-full px-2 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all text-sm">
                                            <option value="mixto">Mixto</option>
                                            <option value="basico">Básico</option>
                                            <option value="intermedio">Medio</option>
                                            <option value="avanzado">Difícil</option>
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-slate-700 text-sm font-semibold mb-2">Formato</label>
                                    <select id="quiz-type" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all text-sm">
                                        <option value="mixta">Mixto (Todos los tipos)</option>
                                        <option value="multiple_choice">Selección múltiple</option>
                                        <option value="true_false">Verdadero / Falso</option>
                                        <option value="short_answer">Respuesta corta</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-slate-700 text-sm font-semibold mb-2">Contexto adicional (Opcional)</label>
                                    <textarea id="quiz-extra" rows="2" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all resize-none text-sm" placeholder="Ej. Enfocar en problemas prácticos..."></textarea>
                                </div>

                                <button id="btn-generate" onclick="window.generateQuizWithAI()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg shadow-indigo-200 transition-all duration-300 hover:-translate-y-1 flex items-center justify-center gap-2">
                                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                                    <span id="btn-generate-text">Generar Evaluación Evaluada</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Panel Derecho: Lista de Pruebas -->
                    <div class="lg:col-span-7">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-2xl font-extrabold text-slate-800 flex items-center gap-2">
                                <i data-lucide="database" class="w-6 h-6 text-indigo-500"></i>
                                Evaluaciones Activas
                            </h2>
                            <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full" id="quiz-counter">0</span>
                        </div>

                        <div id="quizzes-list" class="space-y-4">
                            <!-- Skeleton Loading -->
                            <div class="animate-pulse bg-white p-6 rounded-2xl border border-slate-100">
                                <div class="h-5 bg-slate-200 rounded w-3/4 mb-4"></div>
                                <div class="h-4 bg-slate-200 rounded w-1/2 mb-4"></div>
                                <div class="h-10 bg-slate-100 rounded-xl w-full"></div>
                            </div>
                        </div>
                    </div>

                </div>
            `;
        };

        const renderLoadingStudent = (container) => {
            container.innerHTML = `
                <div class="min-h-[60vh] flex flex-col items-center justify-center animate-fade-in">
                    <div class="relative w-20 h-20 mb-6">
                        <div class="absolute inset-0 rounded-full border-t-4 border-indigo-600 animate-spin"></div>
                        <div class="absolute inset-2 rounded-full border-t-4 border-violet-400 animate-spin" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">Conectando...</h2>
                    <p class="text-slate-500">Buscando la evaluación en el servidor</p>
                </div>
            `;
        };

        const renderStudentName = (container) => {
            container.innerHTML = `
                <div class="max-w-md mx-auto mt-16 p-1 animate-fade-in">
                    <div class="bg-white p-8 rounded-3xl shadow-2xl shadow-green-100 border border-slate-100 text-center">
                        <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-2xl mb-6 text-green-600">
                            <i data-lucide="graduation-cap" class="w-8 h-8"></i>
                        </div>
                        
                        <div class="mb-6">
                            <span class="bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-3 inline-block">
                                Evaluación Activa
                            </span>
                            <h2 class="text-2xl font-extrabold text-slate-800 leading-tight mb-2">
                                ${escapeHTML(window.appState.currentQuiz.topic)}
                            </h2>
                            <p class="text-amber-600 font-medium text-sm flex items-center justify-center gap-1">
                                <i data-lucide="star" class="w-4 h-4"></i> Valor Total: ${window.appState.currentQuiz.totalPoints || 100} Puntos
                            </p>
                        </div>

                        <div class="text-left mb-6">
                            <label class="block text-slate-700 text-sm font-semibold mb-2">Tu Nombre Completo</label>
                            <input
                                type="text"
                                id="student-name-input"
                                class="w-full px-4 py-4 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all"
                                placeholder="Ej. Ana Martínez"
                                onkeypress="if(event.key === 'Enter') window.startQuizProcess()"
                            >
                            <p class="text-xs text-slate-400 mt-2">* Escribe un nombre real (mínimo 3 letras).</p>
                        </div>

                        <button
                            onclick="window.startQuizProcess()"
                            class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-4 rounded-xl transition-all shadow-lg shadow-green-200 hover:-translate-y-1 flex items-center justify-center gap-2">
                            <span>Comenzar Prueba</span>
                            <i data-lucide="play-circle" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            `;
        };

        const renderQuizResult = (container) => {
            const totalQuestions = window.appState.currentQuiz.questions.length;
            const totalPoints = window.appState.currentQuiz.totalPoints || 100;
            const earnedPoints = window.appState.studentEarned;
            const percentage = Math.round((earnedPoints / totalPoints) * 100);
            
            let message = "¡Buen esfuerzo!";
            let icon = "award";
            let colorClass = "text-indigo-500";
            let bgClass = "bg-indigo-50";

            if (percentage >= 90) { message = "¡Excelente Trabajo!"; icon = "trophy"; colorClass = "text-yellow-500"; bgClass = "bg-yellow-50"; }
            else if (percentage >= 60) { message = "¡Prueba Superada!"; icon = "check-circle"; colorClass = "text-green-500"; bgClass = "bg-green-50"; }
            else { message = "Necesitas repasar más"; icon = "alert-circle"; colorClass = "text-red-500"; bgClass = "bg-red-50"; }

            container.innerHTML = `
                <div class="max-w-md mx-auto mt-16 p-1 animate-fade-in">
                    <div class="bg-white p-8 rounded-3xl shadow-2xl border border-slate-100 text-center relative overflow-hidden">
                        
                        <div class="absolute -top-24 -right-24 w-48 h-48 bg-slate-50 rounded-full blur-3xl"></div>
                        
                        <div class="relative z-10">
                            <div class="inline-flex items-center justify-center w-24 h-24 ${bgClass} rounded-full mb-6 ${colorClass} shadow-inner">
                                <i data-lucide="${icon}" class="w-12 h-12"></i>
                            </div>

                            <h2 class="text-3xl font-black text-slate-800 mb-2">${message}</h2>
                            <p class="text-slate-500 font-medium mb-8">${escapeHTML(window.appState.studentName)}</p>

                            <div class="bg-slate-50 rounded-2xl p-6 mb-8 border border-slate-100 relative">
                                <p class="text-xs text-slate-400 uppercase font-bold tracking-widest mb-1">Puntaje Final</p>
                                <div class="flex items-baseline justify-center gap-1">
                                    <span class="text-6xl font-black text-slate-800">${earnedPoints}</span>
                                    <span class="text-2xl font-bold text-slate-400">/ ${totalPoints} Pts</span>
                                </div>
                                <div class="mt-4 w-full bg-slate-200 rounded-full h-2">
                                    <div class="bg-indigo-500 h-2 rounded-full transition-all duration-1000" style="width: ${percentage}%"></div>
                                </div>
                            </div>

                            <div class="flex items-center justify-center gap-2 text-sm text-green-600 bg-green-50 py-3 px-4 rounded-xl border border-green-100">
                                <i data-lucide="check-check" class="w-5 h-5"></i>
                                <span class="font-medium">Respuestas enviadas al profesor</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        /* ================= LOGICA DE LA APP ================= */

        window.loginTeacher = () => {
            const pwd = document.getElementById("teacher-pwd").value;
            if (pwd === "norlan22") {
                window.navigate("teacher_dashboard");
            } else {
                showToast("Contraseña incorrecta", "error");
            }
        };

        const renderTeacherDashboard = () => {
            if (window.appState.view !== "teacher_dashboard") return;

            const listContainer = document.getElementById("quizzes-list");
            const counter = document.getElementById("quiz-counter");
            if (!listContainer) return;

            counter.innerText = quizzes.length;

            if (quizzes.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-slate-50 rounded-2xl p-10 text-center border-2 border-dashed border-slate-200">
                        <div class="inline-flex justify-center items-center w-16 h-16 bg-white rounded-full shadow-sm mb-4 text-slate-400">
                            <i data-lucide="inbox" class="w-8 h-8"></i>
                        </div>
                        <p class="text-slate-600 font-medium">No hay pruebas registradas.</p>
                        <p class="text-slate-400 text-sm mt-1">Usa el generador IA para crear tu primera evaluación.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const sortedQuizzes = [...quizzes].sort((a, b) => b.createdAt - a.createdAt);

            listContainer.innerHTML = sortedQuizzes.map((quiz) => {
                const quizResults = allResults.filter((r) => r.quizId === quiz.id);
                const resolvedCount = quizResults.length;
                const totalPoints = quiz.totalPoints || 100;

                return `
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow group relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-5 pl-2">
                            
                            <div class="flex-1">
                                <h3 class="font-bold text-slate-800 text-lg leading-tight mb-2 group-hover:text-indigo-600 transition-colors">
                                    ${escapeHTML(quiz.topic)}
                                </h3>
                                
                                <div class="flex flex-wrap items-center gap-2 text-xs font-medium text-slate-500 mb-3">
                                    <span class="flex items-center gap-1 bg-slate-100 px-2 py-1 rounded-md">
                                        <i data-lucide="help-circle" class="w-3 h-3"></i> ${quiz.questions.length} Pregs
                                    </span>
                                    <span class="flex items-center gap-1 bg-amber-50 text-amber-700 px-2 py-1 rounded-md border border-amber-100 font-bold">
                                        <i data-lucide="star" class="w-3 h-3"></i> ${totalPoints} Pts
                                    </span>
                                    <span class="flex items-center gap-1 bg-indigo-50 text-indigo-700 px-2 py-1 rounded-md border border-indigo-100">
                                        <i data-lucide="key" class="w-3 h-3"></i> PIN: ${escapeHTML(quiz.pin)}
                                    </span>
                                    <span class="flex items-center gap-1 text-slate-400 ml-auto">
                                        <i data-lucide="calendar" class="w-3 h-3"></i> ${new Date(quiz.createdAt).toLocaleDateString()}
                                    </span>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                                <div class="bg-slate-50 border border-slate-100 rounded-xl px-4 py-2 text-center mr-2 flex-grow lg:flex-grow-0 cursor-pointer hover:bg-slate-100 transition" onclick="window.viewResults('${quiz.id}', '${escapeAttribute(quiz.topic)}')">
                                    <span class="block text-xl font-black text-slate-800 leading-none">${resolvedCount}</span>
                                    <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Respuestas</span>
                                </div>

                                <div class="flex flex-row gap-2 flex-grow lg:flex-grow-0">
                                    <button onclick="window.copyStudentLink('${quiz.pin}')" class="flex-1 bg-white border border-slate-200 hover:bg-slate-50 hover:border-indigo-300 text-slate-700 p-2.5 rounded-xl transition tooltip-btn" title="Copiar Enlace">
                                        <i data-lucide="copy" class="w-5 h-5 mx-auto"></i>
                                    </button>
                                    
                                    <button onclick="window.viewResults('${quiz.id}', '${escapeAttribute(quiz.topic)}')" ${resolvedCount === 0 ? "disabled" : ""} class="flex-1 bg-white border border-slate-200 text-blue-600 hover:bg-blue-50 hover:border-blue-300 disabled:opacity-50 disabled:cursor-not-allowed p-2.5 rounded-xl transition tooltip-btn" title="Ver Calificaciones en Vivo">

        window.deleteQuiz = async (quizId, quizTopic) => {
            const confirmar = confirm(`¿Seguro que quieres eliminar:\n"${quizTopic}"?\n\nSe borrarán todas las respuestas asociadas.`);

            try {

            const topic = document.getElementById("quiz-topic").value.trim();

            const totalPoints = parseInt(document.getElementById("quiz-total-points").value);
            const level = document.getElementById("quiz-level").value;
            const type = document.getElementById("quiz-type").value;
            const extra = document.getElementById("quiz-extra").value.trim();
            
            const btn = document.getElementById("btn-generate");
            const btnText = document.getElementById("btn-generate-text");

            if (!topic) return showToast("Por favor, escribe el tema de la prueba.", "error");
            if (!count || count < 1 || count > 30) return showToast("La cantidad debe estar entre 1 y 30.", "error");
            if (!totalPoints || totalPoints < 1) return showToast("El puntaje total debe ser mayor a 0.", "error");

            btn.disabled = true;
            btn.classList.add("opacity-75", "cursor-wait");
            btnText.innerText = "Generando y distribuyendo puntos...";

            try {
                if (!window.puter || !window.puter.ai) throw new Error("Servicio de IA no disponible temporalmente.");

                const systemPrompt = `Eres un experto educativo creando evaluaciones matemáticas o de cualquier materia. Devuelve ÚNICAMENTE un objeto JSON válido.
Estructura exacta requerida:
{
  "questions": [
    {
      "type": "multiple_choice", // o true_false, fill_blank, short_answer
      "level": "basico", // o intermedio, avanzado
      "points": 10, // Un número entero. IMPORTANTE: LA SUMA EXACTA DE TODOS LOS PUNTOS DE TODAS LAS PREGUNTAS DEBE DAR EL PUNTAJE TOTAL PEDIDO.
      "question": "Texto de la pregunta",
      "options": ["Opc1", "Opc2", "Opc3", "Opc4"], 
      "correct_index": 0, 
      "answer": "" 
    }
  ]
}`;

                const teacherPrompt = `Crea evaluación escolar: Tema: ${topic}. 
Cantidad: EXACTAMENTE ${count} preguntas. 
Nivel: ${level}. Formato: ${type}. 
PUNTAJE TOTAL: ${totalPoints} Puntos. Debes asignar a cada pregunta un atributo numérico 'points'. Asigna más puntos a las preguntas difíciles si el nivel es mixto. LA SUMA de los 'points' de las ${count} preguntas DEBE SER IGUAL A ${totalPoints}.
Notas extra: ${extra || "Ninguna"}.`;

                const aiResponse = await puter.ai.chat(`${systemPrompt}\n\nSolicitud:\n${teacherPrompt}`, { model: "gpt-4.1-nano" });
                const responseText = String(aiResponse);
                
                const startIndex = responseText.indexOf("{");
                const endIndex = responseText.lastIndexOf("}");
                if (startIndex === -1 || endIndex === -1) throw new Error("La IA no devolvió un formato válido.");
                
                const quizData = JSON.parse(responseText.substring(startIndex, endIndex + 1));
                
                validarQuizYPuntos(quizData, count, totalPoints);

                const appId = getAppId();
                const quizzesRef = collection(db, "artifacts", appId, "public", "data", "quizzes");
                const pin = Math.random().toString(36).substring(2, 6).toUpperCase();

                await addDoc(quizzesRef, {
                    topic: `${topic}`,
                    baseTopic: topic,
                    count: count,
                    totalPoints: totalPoints,
                    level: level,
                    type: type,
                    extra: extra,
                    pin: pin,
                    questions: quizData.questions,
                    createdAt: Date.now()
                });

                document.getElementById("quiz-topic").value = "";
                document.getElementById("quiz-extra").value = "";
                showToast("¡Evaluación generada con éxito!", "success");

            } catch (error) {
                console.error(error);
                showToast(error.message, "error");
            } finally {
                btn.disabled = false;
                btn.classList.remove("opacity-75", "cursor-wait");
                btnText.innerText = "Generar Evaluación Evaluada";
            }
        };

        const validarQuizYPuntos = (quizData, expectedCount, expectedTotalPoints) => {
            if (!quizData.questions || !Array.isArray(quizData.questions)) throw new Error("Estructura de preguntas inválida.");
            if (quizData.questions.length === 0) throw new Error("No se generaron preguntas.");
            
            if (quizData.questions.length > expectedCount + 5) quizData.questions = quizData.questions.slice(0, expectedCount);
            
            let currentSum = 0;

            quizData.questions.forEach((q, idx) => {
                if (!q.type || !["multiple_choice", "true_false", "fill_blank", "short_answer"].includes(q.type)) q.type = "short_answer";
                if (!q.level) q.level = "general";
                
                q.points = parseInt(q.points);
                if (isNaN(q.points) || q.points <= 0) q.points = 1;
                
                if (q.type === "multiple_choice") {
                    if (!q.options || q.options.length === 0) q.options = ["A", "B", "C", "D"];
                    if (typeof q.correct_index !== "number") q.correct_index = 0;
                    q.answer = "";
                } else if (q.type === "true_false") {
                    q.options = ["Verdadero", "Falso"];
                    if (typeof q.correct_index !== "number") q.correct_index = 0;
                    q.answer = "";
                } else {
                    q.options = [];
                    q.correct_index = null;
                    if (!q.answer) q.answer = "Respuesta abierta";
                }

                currentSum += q.points;
            });

            if (currentSum !== expectedTotalPoints) {
                const factor = expectedTotalPoints / currentSum;
                let nuevaSuma = 0;
                
                quizData.questions.forEach((q, idx) => {
                    q.points = Math.max(1, Math.round(q.points * factor));
                    nuevaSuma += q.points;
                });

                const diferencia = expectedTotalPoints - nuevaSuma;
                if (diferencia !== 0) {
                    let ultimaPregunta = quizData.questions[quizData.questions.length - 1];
                    ultimaPregunta.points += diferencia;
                    if(ultimaPregunta.points <= 0) ultimaPregunta.points = 1; 
                }
            }
        };

        window.submitQuiz = async () => {
            const quiz = window.appState.currentQuiz;
            const form = document.getElementById("quiz-form");
            const btn = document.getElementById("btn-submit-quiz");

            let correctCount = 0;
            let earnedPoints = 0;
            const studentAnswers = [];

            for (let i = 0; i < quiz.questions.length; i++) {
                const q = quiz.questions[i];
                const ptsDePregunta = q.points || 1;

                if (q.type === "multiple_choice" || q.type === "true_false") {
                    const selected = form.querySelector(`input[name="q_${i}"]:checked`);
                    if (!selected) return showToast(`Te falta responder la pregunta ${i + 1}`, "error");

                    const selectedIndex = parseInt(selected.value);
                    const isCorrect = selectedIndex === q.correct_index;
                    
                    if (isCorrect) {
                        correctCount++;
                        earnedPoints += ptsDePregunta;
                    }

                    studentAnswers.push({
                        question: q.question,
                        type: q.type,
                        answer: q.options[selectedIndex],
                        correctAnswer: q.options[q.correct_index],
                        isCorrect: isCorrect,
                        pointsEarned: isCorrect ? ptsDePregunta : 0
                    });
                } else {
                    const input = form.querySelector(`input[name="q_${i}"]`);
                    const answer = input.value.trim();
                    if (!answer) return showToast(`Te falta responder la pregunta ${i + 1}`, "error");

                    const normA = answer.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "");
                    const normB = q.answer.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "");
                    const isCorrect = normA === normB;
                    
                    if (isCorrect) {
                        correctCount++;
                        earnedPoints += ptsDePregunta;
                    }

                    studentAnswers.push({
                        question: q.question,
                        type: q.type,
                        answer: answer,
                        correctAnswer: q.answer,
                        isCorrect: isCorrect,
                        pointsEarned: isCorrect ? ptsDePregunta : 0
                    });
                }
            }

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Guardando resultados...`;
            lucide.createIcons();

            try {
                const appId = getAppId();
                const resultsRef = collection(db, "artifacts", appId, "public", "data", "results");
                
                await addDoc(resultsRef, {
                    quizId: quiz.id,
                    studentName: window.appState.studentName,
                    correctCount: correctCount,
                    earnedPoints: earnedPoints,
                    totalQuestions: quiz.questions.length,
                    totalPoints: quiz.totalPoints || 100,
                    answers: studentAnswers,
                    timestamp: Date.now()
                });

                window.appState.studentEarned = earnedPoints;
                window.navigate("quiz_result");
            } catch (error) {
                console.error(error);
                showToast("Error de conexión al enviar.", "error");
                btn.disabled = false;
                btn.innerHTML = `<span>Reintentar Envío</span><i data-lucide="send" class="w-5 h-5"></i>`;
                lucide.createIcons();
            }
        };

        const showToast = (message, type = "info") => {
            const toast = document.createElement("div");
            const isError = type === "error";
            toast.className = `fixed bottom-6 left-1/2 transform -translate-x-1/2 flex items-center gap-3 px-6 py-4 rounded-2xl shadow-2xl font-semibold z-50 transition-all duration-300 translate-y-20 opacity-0 min-w-[300px] border ${isError ? 'bg-red-50 text-red-600 border-red-200' : 'bg-slate-900 text-white border-slate-800'}`;
            
            toast.innerHTML = `
                <i data-lucide="${isError ? 'alert-triangle' : 'info'}" class="w-5 h-5"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => toast.classList.remove("translate-y-20", "opacity-0"), 10);
            setTimeout(() => {
                toast.classList.add("translate-y-20", "opacity-0");
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        const escapeHTML = (value) => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
        const escapeAttribute = (value) => String(value ?? "").replaceAll("\\", "\\\\").replaceAll("'", "\\'").replaceAll('"', "&quot;");

        window.onload = () => {
            lucide.createIcons();
            initFirebase();
            checkRouting();
        };
    </script>
