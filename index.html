<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTest Pro - Plataforma de Evaluación IA</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        import {
            getAuth,
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        import {
            getFirestore,
            collection,
            addDoc,
            onSnapshot,
            doc,
            deleteDoc,
            getDocs,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const myFirebaseConfig = {
            apiKey: "AIzaSyDmzF3Td-dPxPtkr1X69pE-oNcdaMQLAoI",
            authDomain: "pruebas-2-f7033.firebaseapp.com",
            databaseURL: "https://pruebas-2-f7033-default-rtdb.firebaseio.com",
            projectId: "pruebas-2-f7033",
            storageBucket: "pruebas-2-f7033.firebasestorage.app",
            messagingSenderId: "287419005795",
            appId: "1:287419005795:web:39a8618a4d725d0d6a7156",
            measurementId: "G-75T54PE8WE"
        };

        let db, auth, currentUser;
        let quizzes = [];
        let allResults = [];

        window.appState = {
            view: "init",
            currentQuiz: null,
            studentName: "",
            studentScore: 0,
            urlPin: null
        };

        const initFirebase = async () => {
            let configToUse = myFirebaseConfig;

            if (typeof __firebase_config !== "undefined" && __firebase_config) {
                configToUse = JSON.parse(__firebase_config);
            }

            try {
                const app = initializeApp(configToUse);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (user) setupDatabaseListeners();
                });

            } catch (error) {
                console.error("Error iniciando Firebase:", error);
                showToast("Error crítico al conectar con Firebase: " + error.message, "error");
            }
        };

        const setupDatabaseListeners = () => {
            if (!currentUser) return;

            const appId = typeof __app_id !== "undefined" ? __app_id : "produccion-edutest";

            const quizzesRef = collection(db, "artifacts", appId, "public", "data", "quizzes");
            const resultsRef = collection(db, "artifacts", appId, "public", "data", "results");

            onSnapshot(quizzesRef, (snapshot) => {
                quizzes = [];
                snapshot.forEach((docItem) => {
                    quizzes.push({
                        id: docItem.id,
                        ...docItem.data()
                    });
                });

                if (window.appState.view === "loading_student") startStudentView();
                if (window.appState.view === "teacher_dashboard") renderTeacherDashboard();

            }, (error) => {
                console.error("Error cargando pruebas:", error);
                showToast("Error cargando pruebas desde Firebase.", "error");
            });

            onSnapshot(resultsRef, (snapshot) => {
                allResults = [];
                snapshot.forEach((docItem) => {
                    allResults.push({
                        id: docItem.id,
                        ...docItem.data()
                    });
                });

                if (window.appState.view === "teacher_dashboard") renderTeacherDashboard();

            }, (error) => {
                console.error("Error cargando resultados:", error);
                showToast("Error cargando resultados desde Firebase.", "error");
            });
        };

        window.navigate = (view) => {
            window.appState.view = view;
            render();
        };

        const checkRouting = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const pin = urlParams.get("pin");

            if (pin) {
                window.appState.urlPin = pin.toUpperCase();
                window.navigate("loading_student");
            } else {
                window.navigate("teacher_login");
            }
        };

        const render = () => {
            const container = document.getElementById("app-content");
            container.innerHTML = "";

            switch (window.appState.view) {
                case "teacher_login":
                    container.innerHTML = `
                        <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl mt-10 border-t-4 border-indigo-600 animate-fade-in">
                            <h2 class="text-2xl font-black text-gray-800 mb-2">Panel del Profesor</h2>
                            <p class="text-gray-500 mb-6 text-sm">Ingresa tu contraseña para acceder al sistema.</p>

                            <input
                                type="password"
                                id="teacher-pwd"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-indigo-500 mb-4"
                                placeholder="Contraseña"
                            >

                            <button
                                onclick="window.loginTeacher()"
                                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md">
                                Ingresar
                            </button>
                        </div>
                    `;
                    break;

                case "teacher_dashboard":
                    renderTeacherDashboardHTML(container);
                    renderTeacherDashboard();
                    break;

                case "loading_student":
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center mt-20">
                            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
                            <p class="text-gray-600 font-medium text-lg">Buscando prueba en el servidor...</p>
                        </div>
                    `;
                    break;

                case "student_name":
                    container.innerHTML = `
                        <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl mt-10 border-t-4 border-green-500 animate-fade-in">
                            <div class="text-center mb-6">
                                <span class="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">
                                    Evaluación en Vivo
                                </span>
                            </div>

                            <h2 class="text-2xl font-bold text-gray-800 mb-2">
                                ${escapeHTML(window.appState.currentQuiz.topic)}
                            </h2>

                            <p class="text-gray-500 mb-6 text-sm">
                                Ingresa tu nombre para iniciar la prueba registrada.
                            </p>

                            <label class="block text-gray-700 text-sm font-bold mb-2">Nombre Completo</label>

                            <input
                                type="text"
                                id="student-name-input"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-green-500 mb-6"
                                placeholder="Ej. Juan Pérez"
                            >

                            <button
                                onclick="window.startQuizProcess()"
                                class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition shadow-md">
                                Iniciar Prueba
                            </button>
                        </div>
                    `;
                    break;

                case "taking_quiz":
                    renderTakingQuiz(container);
                    break;

                case "quiz_result":
                    container.innerHTML = `
                        <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl text-center mt-10 animate-fade-in border-t-4 border-blue-500">
                            <div class="text-6xl mb-4">🏆</div>

                            <h2 class="text-3xl font-bold text-gray-800 mb-2">¡Prueba Finalizada!</h2>

                            <p class="text-gray-600 text-lg mb-6">
                                ${escapeHTML(window.appState.studentName)}
                            </p>

                            <div class="bg-gray-50 rounded-xl p-6 mb-6 border border-gray-100">
                                <p class="text-sm text-gray-500 uppercase font-bold mb-2">
                                    Puntaje Oficial
                                </p>

                                <span class="block text-5xl font-black text-indigo-600">
                                    ${window.appState.studentScore}
                                    <span class="text-2xl text-gray-400">
                                        / ${window.appState.currentQuiz.questions.length}
                                    </span>
                                </span>
                            </div>

                            <p class="text-sm text-green-700 bg-green-50 p-3 rounded-lg border border-green-200">
                                Tus respuestas han sido enviadas exitosamente al sistema del profesor.
                            </p>
                        </div>
                    `;
                    break;
            }
        };

        window.loginTeacher = () => {
            const pwd = document.getElementById("teacher-pwd").value;

            if (pwd === "norlan22") {
                window.navigate("teacher_dashboard");
            } else {
                showToast("Contraseña incorrecta", "error");
            }
        };

        const renderTeacherDashboardHTML = (container) => {
            container.innerHTML = `
                <div class="max-w-5xl mx-auto animate-fade-in">

                    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-lg mb-8 border border-gray-100">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="bg-indigo-100 p-3 rounded-lg text-indigo-600">🤖</div>

                            <div>
                                <h2 class="text-2xl font-black text-gray-800">
                                    Generador IA Pro
                                </h2>
                                <p class="text-sm text-gray-500">
                                    Crea pruebas por tema, nivel, tipo y cantidad.
                                </p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2">
                                    Tema de la prueba
                                </label>

                                <input
                                    id="quiz-topic"
                                    type="text"
                                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50"
                                    placeholder="Ej. Ecuaciones exponenciales"
                                >
                            </div>

                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2">
                                    Cantidad de preguntas
                                </label>

                                <input
                                    id="quiz-count"
                                    type="number"
                                    min="1"
                                    max="30"
                                    value="10"
                                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50"
                                >
                            </div>

                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2">
                                    Nivel
                                </label>

                                <select
                                    id="quiz-level"
                                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50"
                                >
                                    <option value="mixto">Mixto: básico, intermedio y avanzado</option>
                                    <option value="basico">Básico</option>
                                    <option value="intermedio">Intermedio</option>
                                    <option value="avanzado">Avanzado Ultra</option>
                                    <option value="general">General</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2">
                                    Tipo de prueba
                                </label>

                                <select
                                    id="quiz-type"
                                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50"
                                >
                                    <option value="mixta">Mixta</option>
                                    <option value="multiple_choice">Selección múltiple</option>
                                    <option value="true_false">Verdadero/Falso</option>
                                    <option value="fill_blank">Complete</option>
                                    <option value="short_answer">Respuesta corta</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2">
                                Instrucciones extra
                            </label>

                            <textarea
                                id="quiz-extra"
                                rows="3"
                                class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none bg-gray-50"
                                placeholder="Ej. Que sea difícil, con problemas largos, razonamiento y trampas."></textarea>
                        </div>

                        <div class="flex justify-end mt-5">
                            <button
                                id="btn-generate"
                                onclick="window.generateQuizWithAI()"
                                class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                                Generar Prueba Oficial
                            </button>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-xl font-bold text-gray-800 mb-4 px-2">
                            Base de Datos de Pruebas
                        </h2>

                        <div id="quizzes-list" class="grid grid-cols-1 gap-4">
                            <div class="animate-pulse flex space-x-4 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                <div class="flex-1 space-y-4 py-1">
                                    <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                                    <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            `;
        };

        const renderTeacherDashboard = () => {
            if (window.appState.view !== "teacher_dashboard") return;

            const listContainer = document.getElementById("quizzes-list");
            if (!listContainer) return;

            if (quizzes.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-white rounded-xl p-8 text-center border border-dashed border-gray-300">
                        <p class="text-gray-500">No hay pruebas registradas en la base de datos.</p>
                    </div>
                `;
                return;
            }

            const sortedQuizzes = [...quizzes].sort((a, b) => b.createdAt - a.createdAt);

            listContainer.innerHTML = sortedQuizzes.map((quiz) => {
                const quizResults = allResults.filter((r) => r.quizId === quiz.id);
                const resolvedCount = quizResults.length;

                return `
                    <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition">
                        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">

                            <div class="flex-1">
                                <h3 class="font-bold text-gray-800 text-lg mb-1">
                                    ${escapeHTML(quiz.topic)}
                                </h3>

                                <div class="flex flex-wrap items-center gap-3 text-sm text-gray-500">
                                    <span class="font-semibold text-gray-700">
                                        ${quiz.questions.length} Preguntas
                                    </span>

                                    <span>•</span>

                                    <span class="text-indigo-600 font-semibold bg-indigo-50 px-2 py-0.5 rounded">
                                        PIN: ${escapeHTML(quiz.pin)}
                                    </span>

                                    <span>•</span>

                                    <span>${new Date(quiz.createdAt).toLocaleDateString()}</span>
                                </div>

                                <div class="flex flex-wrap gap-2 mt-3">
                                    <span class="text-xs font-bold bg-gray-100 text-gray-700 px-3 py-1 rounded-full">
                                        Nivel: ${escapeHTML(getReadableLevel(quiz.level || "general"))}
                                    </span>

                                    <span class="text-xs font-bold bg-gray-100 text-gray-700 px-3 py-1 rounded-full">
                                        Tipo: ${escapeHTML(getReadableType(quiz.type || "mixta"))}
                                    </span>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto mt-4 lg:mt-0 pt-4 lg:pt-0 border-t lg:border-t-0 border-gray-100">

                                <div class="text-center px-4 border-r border-gray-200 hidden sm:block">
                                    <span class="block text-2xl font-black text-gray-800">
                                        ${resolvedCount}
                                    </span>

                                    <span class="text-xs text-gray-500 uppercase tracking-wide">
                                        La han resuelto
                                    </span>
                                </div>

                                <div class="block sm:hidden w-full bg-blue-50 text-blue-700 text-sm font-bold px-4 py-2 rounded-lg text-center">
                                    ${resolvedCount} estudiante${resolvedCount === 1 ? "" : "s"} la han resuelto
                                </div>

                                <button
                                    onclick="window.copyStudentLink('${quiz.pin}')"
                                    class="flex-1 lg:flex-none bg-white border border-indigo-200 hover:bg-indigo-50 text-indigo-700 font-medium py-2 px-4 rounded-lg transition">
                                    Copiar Enlace
                                </button>

                                <button
                                    onclick="window.downloadExcel('${quiz.id}', '${escapeAttribute(quiz.topic)}')"
                                    ${resolvedCount === 0 ? "disabled" : ""}
                                    class="flex-1 lg:flex-none bg-green-500 hover:bg-green-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-medium py-2 px-4 rounded-lg transition">
                                    Descargar Excel
                                </button>

                                <button
                                    onclick="window.deleteQuiz('${quiz.id}', '${escapeAttribute(quiz.topic)}')"
                                    class="flex-1 lg:flex-none bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded-lg transition">
                                    Eliminar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        };

        window.copyStudentLink = (pin) => {
            const baseUrl = window.location.origin + window.location.pathname;
            const link = `${baseUrl}?pin=${pin}`;

            navigator.clipboard.writeText(link)
                .then(() => showToast("Enlace copiado", "success"))
                .catch(() => {
                    const tempInput = document.createElement("input");
                    tempInput.value = link;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand("copy");
                    document.body.removeChild(tempInput);
                    showToast("Enlace copiado", "success");
                });
        };

        window.deleteQuiz = async (quizId, quizTopic) => {
            const confirmar = confirm(
                `¿Seguro que quieres eliminar esta prueba?\n\n${quizTopic}\n\nTambién se eliminarán los resultados guardados.`
            );

            if (!confirmar) return;

            try {
                const appId = typeof __app_id !== "undefined" ? __app_id : "produccion-edutest";

                const quizDocRef = doc(db, "artifacts", appId, "public", "data", "quizzes", quizId);
                const resultsRef = collection(db, "artifacts", appId, "public", "data", "results");
                const resultsQuery = query(resultsRef, where("quizId", "==", quizId));
                const resultsSnapshot = await getDocs(resultsQuery);

                const deletePromises = [];

                resultsSnapshot.forEach((resultDoc) => {
                    deletePromises.push(deleteDoc(resultDoc.ref));
                });

                await Promise.all(deletePromises);
                await deleteDoc(quizDocRef);

                showToast("Prueba eliminada correctamente.", "success");

            } catch (error) {
                console.error("Error eliminando prueba:", error);
                showToast("Error al eliminar la prueba: " + error.message, "error");
            }
        };

        window.generateQuizWithAI = async () => {
            const topicInput = document.getElementById("quiz-topic");
            const countInput = document.getElementById("quiz-count");
            const levelInput = document.getElementById("quiz-level");
            const typeInput = document.getElementById("quiz-type");
            const extraInput = document.getElementById("quiz-extra");
            const btn = document.getElementById("btn-generate");

            const topic = topicInput.value.trim();
            const count = parseInt(countInput.value);
            const level = levelInput.value;
            const type = typeInput.value;
            const extra = extraInput.value.trim();

            if (!topic) {
                showToast("Escribe el tema de la prueba.", "error");
                return;
            }

            if (!count || count < 1 || count > 30) {
                showToast("La cantidad debe estar entre 1 y 30 preguntas.", "error");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "Generando prueba difícil...";

            try {
                if (!window.puter || !window.puter.ai) {
                    throw new Error("Puter.js no cargó correctamente. Recarga la página.");
                }

                const systemPrompt = `
Eres un generador profesional de pruebas escolares en español.

Tu tarea es crear evaluaciones de alta calidad para estudiantes de undécimo año de secundaria.

Tipos permitidos:

1. multiple_choice
- Selección múltiple.
- Debe tener 4 opciones.
- Usa correct_index para la opción correcta.
- answer debe ser "".

2. true_false
- Verdadero o falso.
- options debe ser ["Verdadero", "Falso"].
- correct_index debe ser 0 o 1.
- answer debe ser "".

3. fill_blank
- Complete.
- La pregunta debe incluir "____".
- options debe ser [].
- correct_index debe ser null.
- answer debe tener la respuesta correcta.

4. short_answer
- Respuesta corta.
- options debe ser [].
- correct_index debe ser null.
- answer debe tener la respuesta correcta.

Niveles permitidos:
- basico
- intermedio
- avanzado
- general

Definición de dificultad:
- basico: preguntas sencillas y directas.
- intermedio: preguntas normales, con algo de análisis.
- avanzado: preguntas MUY difíciles, de reto máximo, con razonamiento profundo, varios pasos, distractores fuertes y enunciados exigentes. Deben ser difíciles para estudiantes de undécimo año, pero sin mencionar otro nivel académico.
- general: dificultad equilibrada.

Reglas especiales para avanzado:
- Si el profesor elige avanzado, crea una prueba difícilísima.
- Usa problemas que requieran análisis, interpretación, cálculo o razonamiento.
- Evita preguntas obvias.
- Usa distractores parecidos a la respuesta correcta.
- Incluye trampas académicas sanas: signos, unidades, interpretación, condiciones, excepciones o detalles ocultos.
- Mantén el contenido dentro del tema pedido.
- No menciones la palabra "universitario" en preguntas, opciones ni explicaciones.
- No expliques nada fuera del JSON.

Devuelve solamente JSON válido.
No uses markdown.
No escribas texto antes ni después del JSON.

Formato obligatorio:
{
  "questions": [
    {
      "type": "multiple_choice",
      "level": "avanzado",
      "question": "Pregunta aquí",
      "options": ["Opción A", "Opción B", "Opción C", "Opción D"],
      "correct_index": 0,
      "answer": ""
    }
  ]
}

Reglas obligatorias:
- Genera exactamente la cantidad pedida.
- Si el nivel es mixto, reparte entre basico, intermedio y avanzado.
- Si el tipo es mixta, mezcla multiple_choice, true_false, fill_blank y short_answer.
- Cada pregunta debe tener type, level, question, options, correct_index y answer.
- No dejes preguntas vacías.
- Las respuestas deben ser claras y comparables.
`;

                const teacherRequest = `
Crea una prueba escolar sobre: ${topic}
Cantidad exacta de preguntas: ${count}
Nivel solicitado: ${level}
Tipo de prueba: ${type}
Instrucciones extra: ${extra || "Ninguna"}

Si el nivel solicitado es "avanzado", hazla difícilísima, con razonamiento fuerte, problemas retadores y distractores complicados.
No uses ni menciones la palabra "universitario".
Si el nivel solicitado es "mixto", incluye básico, intermedio y avanzado, donde avanzado sea el bloque más difícil.
Si el tipo de prueba es "mixta", mezcla selección múltiple, verdadero/falso, complete y respuesta corta.
`;

                const fullPrompt = `${systemPrompt}\n\nSolicitud del profesor:\n${teacherRequest}`;

                let responseText = "";

                try {
                    const aiResponse = await puter.ai.chat(fullPrompt, {
                        model: "gpt-4.1-nano"
                    });

                    responseText = String(aiResponse);
                    console.log("Respuesta Puter IA:", responseText);

                } catch (e) {
                    console.error("Error Puter IA:", e);
                    throw new Error("ERROR IA: No se pudo generar la prueba. Recarga e intenta otra vez.");
                }

                let quizData;

                try {
                    const startIndex = responseText.indexOf("{");
                    const endIndex = responseText.lastIndexOf("}");

                    if (startIndex === -1 || endIndex === -1) {
                        throw new Error("La IA no devolvió JSON.");
                    }

                    const jsonText = responseText.substring(startIndex, endIndex + 1);
                    quizData = JSON.parse(jsonText);

                    validarQuiz(quizData);

                    if (quizData.questions.length !== count) {
                        throw new Error("La IA no generó la cantidad exacta. Intenta de nuevo.");
                    }

                } catch (e) {
                    console.error("Respuesta cruda fallida:", responseText);
                    throw new Error("ERROR FORMATO IA: La IA no estructuró bien la prueba. Intenta otra vez.");
                }

                const appId = typeof __app_id !== "undefined" ? __app_id : "produccion-edutest";
                const quizzesRef = collection(db, "artifacts", appId, "public", "data", "quizzes");
                const pin = Math.random().toString(36).substring(2, 6).toUpperCase();

                await addDoc(quizzesRef, {
                    topic: `${topic} - ${count} preguntas`,
                    baseTopic: topic,
                    count: count,
                    level: level,
                    type: type,
                    extra: extra,
                    pin: pin,
                    questions: quizData.questions,
                    createdAt: Date.now()
                });

                topicInput.value = "";
                countInput.value = "10";
                levelInput.value = "mixto";
                typeInput.value = "mixta";
                extraInput.value = "";

                showToast("Prueba generada y guardada exitosamente.", "success");

            } catch (error) {
                console.error("Detalle exacto del error:", error);
                showToast(error.message, "error");

            } finally {
                btn.disabled = false;
                btn.innerHTML = "Generar Prueba Oficial";
            }
        };

        const validarQuiz = (quizData) => {
            if (!quizData.questions || !Array.isArray(quizData.questions)) {
                throw new Error("El JSON no tiene questions.");
            }

            if (quizData.questions.length === 0) {
                throw new Error("No se generaron preguntas.");
            }

            const validTypes = ["multiple_choice", "true_false", "fill_blank", "short_answer"];

            quizData.questions.forEach((q, index) => {
                if (!q.type || !validTypes.includes(q.type)) {
                    throw new Error(`Pregunta ${index + 1} tiene type inválido.`);
                }

                if (!q.level || typeof q.level !== "string") {
                    q.level = "general";
                }

                const cleanLevel = q.level.toLowerCase();

                if (!["basico", "básico", "intermedio", "avanzado", "general"].includes(cleanLevel)) {
                    q.level = "general";
                }

                if (cleanLevel === "básico") {
                    q.level = "basico";
                }

                if (!q.question || typeof q.question !== "string") {
                    throw new Error(`Pregunta ${index + 1} inválida.`);
                }

                if (q.type === "multiple_choice") {
                    if (!Array.isArray(q.options) || q.options.length !== 4) {
                        throw new Error(`Pregunta ${index + 1} no tiene 4 opciones.`);
                    }

                    if (
                        typeof q.correct_index !== "number" ||
                        q.correct_index < 0 ||
                        q.correct_index > 3
                    ) {
                        throw new Error(`Pregunta ${index + 1} tiene correct_index inválido.`);
                    }

                    q.answer = "";
                }

                if (q.type === "true_false") {
                    q.options = ["Verdadero", "Falso"];

                    if (
                        typeof q.correct_index !== "number" ||
                        q.correct_index < 0 ||
                        q.correct_index > 1
                    ) {
                        throw new Error(`Pregunta ${index + 1} tiene correct_index inválido.`);
                    }

                    q.answer = "";
                }

                if (q.type === "fill_blank" || q.type === "short_answer") {
                    q.options = [];
                    q.correct_index = null;

                    if (!q.answer || typeof q.answer !== "string") {
                        throw new Error(`Pregunta ${index + 1} no tiene respuesta correcta.`);
                    }

                    if (q.type === "fill_blank" && !q.question.includes("____")) {
                        q.question = q.question + " ____";
                    }
                }
            });
        };

        window.downloadExcel = (quizId, quizTopic) => {
            const quizResults = allResults.filter((r) => r.quizId === quizId);

            let excelData = [];

            quizResults.forEach((r) => {
                if (Array.isArray(r.answers) && r.answers.length > 0) {
                    r.answers.forEach((ans, index) => {
                        excelData.push({
                            "Estudiante": r.studentName,
                            "Puntaje": `${r.score}/${r.totalQuestions}`,
                            "Calificación (%)": ((r.score / r.totalQuestions) * 100).toFixed(0) + "%",
                            "Pregunta #": index + 1,
                            "Nivel": getReadableLevel(ans.level || "general"),
                            "Tipo": getReadableType(ans.type),
                            "Pregunta": ans.question,
                            "Respuesta del estudiante": ans.answer,
                            "Respuesta correcta": ans.correctAnswer,
                            "Correcta": ans.isCorrect ? "Sí" : "No",
                            "Fecha": new Date(r.timestamp).toLocaleString()
                        });
                    });
                } else {
                    excelData.push({
                        "Estudiante": r.studentName,
                        "Puntaje": `${r.score}/${r.totalQuestions}`,
                        "Calificación (%)": ((r.score / r.totalQuestions) * 100).toFixed(0) + "%",
                        "Fecha": new Date(r.timestamp).toLocaleString()
                    });
                }
            });

            const ws = XLSX.utils.json_to_sheet(excelData);

            ws["!cols"] = [
                { wch: 30 },
                { wch: 15 },
                { wch: 15 },
                { wch: 12 },
                { wch: 18 },
                { wch: 18 },
                { wch: 50 },
                { wch: 30 },
                { wch: 30 },
                { wch: 12 },
                { wch: 25 }
            ];

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Resultados");

            const cleanTopic = quizTopic.substring(0, 15).replace(/[^a-z0-9]/gi, "");
            XLSX.writeFile(wb, `Reporte_Oficial_${cleanTopic}.xlsx`);
        };

        const startStudentView = () => {
            const pin = window.appState.urlPin;
            const quiz = quizzes.find((q) => q.pin === pin);

            if (quiz) {
                window.appState.currentQuiz = quiz;
                window.navigate("student_name");
            } else if (quizzes.length > 0) {
                document.getElementById("app-content").innerHTML = `
                    <div class="max-w-md mx-auto text-center mt-20 p-6 bg-white rounded-xl shadow-lg border-t-4 border-red-500">
                        <h2 class="text-xl font-bold text-gray-800">Enlace No Válido</h2>
                        <p class="text-gray-500 mt-2">
                            Esta prueba no se encuentra en el servidor o el PIN es incorrecto.
                        </p>
                    </div>
                `;
            }
        };

        window.startQuizProcess = () => {
            const name = document.getElementById("student-name-input").value.trim();

            if (!name) {
                showToast("Debes ingresar tu nombre.", "error");
                return;
            }

            window.appState.studentName = name;
            window.navigate("taking_quiz");
        };

        const renderTakingQuiz = (container) => {
            const quiz = window.appState.currentQuiz;

            let questionsHTML = quiz.questions.map((q, qIndex) => {
                let answerHTML = "";

                if (q.type === "multiple_choice" || q.type === "true_false") {
                    answerHTML = q.options.map((opt, oIndex) => `
                        <label class="block p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-green-50 transition">
                            <div class="flex items-center">
                                <input
                                    type="radio"
                                    name="q_${qIndex}"
                                    value="${oIndex}"
                                    class="w-5 h-5 text-green-600 bg-gray-100 border-gray-300 focus:ring-green-500"
                                >

                                <span class="ml-4 text-gray-700 font-medium">
                                    ${escapeHTML(opt)}
                                </span>
                            </div>
                        </label>
                    `).join("");
                }

                if (q.type === "fill_blank" || q.type === "short_answer") {
                    answerHTML = `
                        <input
                            type="text"
                            name="q_${qIndex}"
                            class="w-full px-4 py-4 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500"
                            placeholder="Escribe tu respuesta aquí"
                        >
                    `;
                }

                return `
                    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100 mb-6">
                        <div class="flex flex-wrap gap-2 mb-4">
                            ${getLevelBadge(q.level)}

                            <span class="text-xs font-bold bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">
                                ${getReadableType(q.type)}
                            </span>
                        </div>

                        <h3 class="text-lg font-bold text-gray-800 mb-6">
                            <span class="text-green-500">${qIndex + 1}.</span>
                            ${escapeHTML(q.question)}
                        </h3>

                        <div class="space-y-3">
                            ${answerHTML}
                        </div>
                    </div>
                `;
            }).join("");

            container.innerHTML = `
                <div class="max-w-3xl mx-auto animate-fade-in pb-10">
                    <div class="bg-green-600 text-white p-6 rounded-2xl shadow-lg mb-8 flex flex-col sm:flex-row justify-between items-center gap-4 sticky top-4 z-20">
                        <div>
                            <h2 class="text-xl font-bold">
                                ${escapeHTML(quiz.topic)}
                            </h2>
                        </div>

                        <div class="bg-white/20 px-4 py-2 rounded-lg font-bold backdrop-blur-sm">
                            ${escapeHTML(window.appState.studentName)}
                        </div>
                    </div>

                    <form id="quiz-form" onsubmit="event.preventDefault(); window.submitQuiz();">
                        ${questionsHTML}

                        <button
                            type="submit"
                            id="btn-submit-quiz"
                            class="w-full mt-4 bg-gray-800 hover:bg-gray-900 text-white font-bold py-5 rounded-2xl shadow-xl transition transform hover:scale-[1.02] text-xl">
                            Enviar y Finalizar Prueba
                        </button>
                    </form>
                </div>
            `;
        };

        window.submitQuiz = async () => {
            const quiz = window.appState.currentQuiz;
            const form = document.getElementById("quiz-form");
            const btn = document.getElementById("btn-submit-quiz");

            let score = 0;
            const studentAnswers = [];

            for (let i = 0; i < quiz.questions.length; i++) {
                const q = quiz.questions[i];

                if (q.type === "multiple_choice" || q.type === "true_false") {
                    const selected = form.querySelector(`input[name="q_${i}"]:checked`);

                    if (!selected) {
                        showToast(`Responde la pregunta ${i + 1}`, "error");
                        return;
                    }

                    const selectedIndex = parseInt(selected.value);
                    const isCorrect = selectedIndex === q.correct_index;

                    if (isCorrect) score++;

                    studentAnswers.push({
                        question: q.question,
                        type: q.type,
                        level: q.level,
                        answer: q.options[selectedIndex],
                        correctAnswer: q.options[q.correct_index],
                        isCorrect: isCorrect
                    });
                }

                if (q.type === "fill_blank" || q.type === "short_answer") {
                    const input = form.querySelector(`input[name="q_${i}"]`);
                    const answer = input.value.trim();

                    if (!answer) {
                        showToast(`Responde la pregunta ${i + 1}`, "error");
                        return;
                    }

                    const isCorrect = compareTextAnswers(answer, q.answer);

                    if (isCorrect) score++;

                    studentAnswers.push({
                        question: q.question,
                        type: q.type,
                        level: q.level,
                        answer: answer,
                        correctAnswer: q.answer,
                        isCorrect: isCorrect
                    });
                }
            }

            btn.disabled = true;
            btn.innerHTML = "Enviando a la base de datos...";

            try {
                const appId = typeof __app_id !== "undefined" ? __app_id : "produccion-edutest";
                const resultsRef = collection(db, "artifacts", appId, "public", "data", "results");

                await addDoc(resultsRef, {
                    quizId: quiz.id,
                    studentName: window.appState.studentName,
                    score: score,
                    totalQuestions: quiz.questions.length,
                    answers: studentAnswers,
                    timestamp: Date.now()
                });

                window.appState.studentScore = score;
                window.navigate("quiz_result");

            } catch (error) {
                console.error(error);
                showToast("Error de conexión al enviar. Intenta de nuevo.", "error");

                btn.disabled = false;
                btn.innerHTML = "Enviar y Finalizar Prueba";
            }
        };

        const normalizeText = (text) => {
            return String(text || "")
                .toLowerCase()
                .trim()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[.,;:!?¿¡()]/g, "")
                .replace(/\s+/g, " ");
        };

        const compareTextAnswers = (studentAnswer, correctAnswer) => {
            const a = normalizeText(studentAnswer);
            const b = normalizeText(correctAnswer);

            if (a === b) return true;

            const aNoSpace = a.replace(/\s+/g, "");
            const bNoSpace = b.replace(/\s+/g, "");

            return aNoSpace === bNoSpace;
        };

        const getReadableType = (type) => {
            if (type === "multiple_choice") return "Selección múltiple";
            if (type === "true_false") return "Verdadero/Falso";
            if (type === "fill_blank") return "Complete";
            if (type === "short_answer") return "Respuesta corta";
            if (type === "mixta") return "Mixta";
            return "Pregunta";
        };

        const getReadableLevel = (level) => {
            const cleanLevel = String(level || "general").toLowerCase();

            if (cleanLevel === "basico" || cleanLevel === "básico") return "Básico";
            if (cleanLevel === "intermedio") return "Intermedio";
            if (cleanLevel === "avanzado") return "Avanzado Ultra";
            if (cleanLevel === "mixto") return "Mixto";
            return "General";
        };

        const getLevelBadge = (level) => {
            const cleanLevel = String(level || "general").toLowerCase();

            if (cleanLevel === "basico" || cleanLevel === "básico") {
                return `<span class="text-xs font-bold bg-green-100 text-green-700 px-3 py-1 rounded-full">Básico</span>`;
            }

            if (cleanLevel === "intermedio") {
                return `<span class="text-xs font-bold bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full">Intermedio</span>`;
            }

            if (cleanLevel === "avanzado") {
                return `<span class="text-xs font-bold bg-red-100 text-red-700 px-3 py-1 rounded-full">Avanzado Ultra</span>`;
            }

            return `<span class="text-xs font-bold bg-gray-100 text-gray-700 px-3 py-1 rounded-full">General</span>`;
        };

        const showToast = (message, type = "info") => {
            const toast = document.createElement("div");
            const bgColor = type === "error" ? "bg-red-500" : "bg-green-500";

            toast.className = `
                fixed bottom-6 left-1/2 transform -translate-x-1/2
                w-[90%] max-w-md ${bgColor} text-white px-6 py-4
                rounded-xl shadow-2xl font-medium z-50 transition-all
                duration-300 translate-y-20 opacity-0 break-words
                text-sm sm:text-base
            `;

            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove("translate-y-20", "opacity-0");
            }, 10);

            setTimeout(() => {
                toast.classList.add("translate-y-20", "opacity-0");
                setTimeout(() => toast.remove(), 300);
            }, 6000);
        };

        const escapeHTML = (value) => {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        };

        const escapeAttribute = (value) => {
            return String(value ?? "")
                .replaceAll("\\", "\\\\")
                .replaceAll("'", "\\'")
                .replaceAll('"', "&quot;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");
        };

        window.onload = () => {
            initFirebase();
            checkRouting();
        };
    </script>

    <style>
        body {
            font-family: Inter, system-ui, sans-serif;
            background-color: #f8fafc;
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <header class="bg-white shadow-sm border-b border-gray-100 z-30">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-center">
            <h1 class="text-xl font-black text-gray-800">
                EduTest <span class="text-indigo-600">Pro</span>
            </h1>
        </div>
    </header>

    <main id="app-content" class="flex-grow w-full px-4 py-8 relative">
        <!-- Contenido dinámico -->
    </main>

</body>
</html>
