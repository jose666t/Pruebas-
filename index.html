
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTest Pro - Plataforma de Evaluación IA</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS para exportar a Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =====================================================================
        // 🟢 1. CONFIGURACIÓN DE BASE DE DATOS FIREBASE DEL USUARIO
        // =====================================================================
        const myFirebaseConfig = {
            apiKey: "AIzaSyDmzF3Td-dPxPtkr1X69pE-oNcdaMQLAoI",
            authDomain: "pruebas-2-f7033.firebaseapp.com",
            databaseURL: "https://pruebas-2-f7033-default-rtdb.firebaseio.com",
            projectId: "pruebas-2-f7033",
            storageBucket: "pruebas-2-f7033.firebasestorage.app",
            messagingSenderId: "287419005795",
            appId: "1:287419005795:web:39a8618a4d725d0d6a7156",
            measurementId: "G-75T54PE8WE"
        };

        // Tu API KEY de Gemini
        const geminiApiKey = "AIzaSyB0qFGjOXcgReqjiAkdbX3VEu3OvV6HBnc"; 

        // Variables Globales
        let db, auth, currentUser;
        let quizzes = [];
        let allResults = [];

        // 2. Inicialización
        const initFirebase = async () => {
            let configToUse = myFirebaseConfig;

            // Compatibilidad para previsualización en este chat vs Netlify
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                configToUse = JSON.parse(__firebase_config);
            }

            try {
                const app = initializeApp(configToUse);
                auth = getAuth(app);
                db = getFirestore(app);

                // Autenticación anónima para que los estudiantes no necesiten crear cuenta
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (user) setupDatabaseListeners();
                });
            } catch (error) {
                console.error("Error iniciando base de datos:", error);
                showToast("Error conectando al servidor principal.", "error");
            }
        };

        // 3. Escuchar la Base de Datos en Tiempo Real
        const setupDatabaseListeners = () => {
            if (!currentUser) return;
            // Estructura de carpetas en Firebase
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'produccion-edutest';
            
            const quizzesRef = collection(db, 'artifacts', appId, 'public', 'data', 'quizzes');
            const resultsRef = collection(db, 'artifacts', appId, 'public', 'data', 'results');

            onSnapshot(quizzesRef, (snapshot) => {
                quizzes = [];
                snapshot.forEach((doc) => quizzes.push({ id: doc.id, ...doc.data() }));
                if (window.appState.view === 'loading_student') startStudentView();
                else if (window.appState.view === 'teacher_dashboard') renderTeacherDashboard();
            }, (error) => console.error("Error cargando pruebas:", error));

            onSnapshot(resultsRef, (snapshot) => {
                allResults = [];
                snapshot.forEach((doc) => allResults.push({ id: doc.id, ...doc.data() }));
                if (window.appState.view === 'teacher_dashboard') renderTeacherDashboard();
            }, (error) => console.error("Error cargando resultados:", error));
        };

        // --- SISTEMA DE NAVEGACIÓN ---
        window.appState = { view: 'init', currentQuiz: null, studentName: '', studentScore: 0, urlPin: null };

        window.navigate = (view) => {
            window.appState.view = view;
            render();
        };

        const checkRouting = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const pin = urlParams.get('pin');
            if (pin) {
                window.appState.urlPin = pin.toUpperCase();
                navigate('loading_student');
            } else {
                navigate('teacher_login');
            }
        };

        const render = () => {
            const container = document.getElementById('app-content');
            container.innerHTML = '';

            switch (window.appState.view) {
                case 'teacher_login':
                    container.innerHTML = `
                        <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl mt-10 border-t-4 border-indigo-600 animate-fade-in">
                            <h2 class="text-2xl font-black text-gray-800 mb-2">Panel del Profesor</h2>
                            <p class="text-gray-500 mb-6 text-sm">Ingresa tu contraseña para acceder al sistema de producción.</p>
                            <input type="password" id="teacher-pwd" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-indigo-500 mb-4" placeholder="Contraseña">
                            <button onclick="window.loginTeacher()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md">
                                Ingresar
                            </button>
                        </div>
                    `;
                    break;
                case 'teacher_dashboard':
                    renderTeacherDashboardHTML(container);
                    renderTeacherDashboard();
                    break;
                case 'loading_student':
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center mt-20">
                            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
                            <p class="text-gray-600 font-medium text-lg">Buscando prueba en el servidor...</p>
                        </div>
                    `;
                    break;
                case 'student_name':
                    container.innerHTML = `
                        <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl mt-10 border-t-4 border-green-500 animate-fade-in">
                            <div class="text-center mb-6">
                                <span class="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Evaluación en Vivo</span>
                            </div>
                            <h2 class="text-2xl font-bold text-gray-800 mb-2">${window.appState.currentQuiz.topic}</h2>
                            <p class="text-gray-500 mb-6 text-sm">Ingresa tu nombre para iniciar la prueba registrada.</p>
                            
                            <label class="block text-gray-700 text-sm font-bold mb-2">Nombre Completo</label>
                            <input type="text" id="student-name-input" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-green-500 mb-6" placeholder="Ej. Juan Pérez">
                            
                            <button onclick="window.startQuizProcess()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition shadow-md">
                                Iniciar Prueba
                            </button>
                        </div>
                    `;
                    break;
                case 'taking_quiz':
                    renderTakingQuiz(container);
                    break;
                case 'quiz_result':
                    container.innerHTML = `
                        <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl text-center mt-10 animate-fade-in border-t-4 border-blue-500">
                            <div class="text-6xl mb-4">🏆</div>
                            <h2 class="text-3xl font-bold text-gray-800 mb-2">¡Prueba Finalizada!</h2>
                            <p class="text-gray-600 text-lg mb-6">${window.appState.studentName}</p>
                            
                            <div class="bg-gray-50 rounded-xl p-6 mb-6 border border-gray-100">
                                <p class="text-sm text-gray-500 uppercase font-bold mb-2">Puntaje Oficial</p>
                                <span class="block text-5xl font-black text-indigo-600">
                                    ${window.appState.studentScore} <span class="text-2xl text-gray-400">/ ${window.appState.currentQuiz.questions.length}</span>
                                </span>
                            </div>

                            <p class="text-sm text-green-700 bg-green-50 p-3 rounded-lg border border-green-200">
                                Tus respuestas han sido enviadas exitosamente al sistema del profesor. Ya puedes cerrar esta ventana.
                            </p>
                        </div>
                    `;
                    break;
            }
        };

        // --- LÓGICA DEL PROFESOR ---

        window.loginTeacher = () => {
            const pwd = document.getElementById('teacher-pwd').value;
            // CONTRASEÑA DE PRODUCCIÓN: norlan22
            if (pwd === 'norlan22') {
                navigate('teacher_dashboard');
            } else {
                showToast('Contraseña incorrecta', 'error');
            }
        };

        const renderTeacherDashboardHTML = (container) => {
            container.innerHTML = `
                <div class="max-w-5xl mx-auto animate-fade-in">
                    <div class="bg-white p-8 rounded-2xl shadow-lg mb-8 border border-gray-100">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="bg-indigo-100 p-3 rounded-lg text-indigo-600">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                            </div>
                            <h2 class="text-2xl font-black text-gray-800">Generador IA (Producción)</h2>
                        </div>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2">Instrucciones para la Inteligencia Artificial</label>
                                <textarea id="quiz-prompt" rows="3" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none bg-gray-50" placeholder="Ej. Genera 10 problemas de matemáticas avanzadas."></textarea>
                            </div>
                            <div class="flex justify-end">
                                <button id="btn-generate" onclick="window.generateQuizWithAI()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                                    Generar Prueba Oficial
                                </button>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-xl font-bold text-gray-800 mb-4 px-2">Base de Datos de Pruebas</h2>
                        <div id="quizzes-list" class="grid grid-cols-1 gap-4">
                            <div class="animate-pulse flex space-x-4 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                <div class="flex-1 space-y-4 py-1">
                                    <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                                    <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        const renderTeacherDashboard = () => {
            if (window.appState.view !== 'teacher_dashboard') return;
            const listContainer = document.getElementById('quizzes-list');
            if (!listContainer) return;

            if (quizzes.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-white rounded-xl p-8 text-center border border-dashed border-gray-300">
                        <p class="text-gray-500">No hay pruebas registradas en la base de datos.</p>
                    </div>`;
                return;
            }

            const sortedQuizzes = [...quizzes].sort((a, b) => b.createdAt - a.createdAt);

            listContainer.innerHTML = sortedQuizzes.map(quiz => {
                const quizResults = allResults.filter(r => r.quizId === quiz.id);
                
                return `
                    <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition">
                        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                            
                            <div class="flex-1">
                                <h3 class="font-bold text-gray-800 text-lg mb-1">${quiz.topic}</h3>
                                <div class="flex flex-wrap items-center gap-3 text-sm text-gray-500">
                                    <span class="font-semibold text-gray-700">${quiz.questions.length} Preguntas</span>
                                    <span>•</span>
                                    <span class="text-indigo-600 font-semibold bg-indigo-50 px-2 py-0.5 rounded">PIN: ${quiz.pin}</span>
                                    <span>•</span>
                                    <span>${new Date(quiz.createdAt).toLocaleDateString()}</span>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto mt-4 lg:mt-0 pt-4 lg:pt-0 border-t lg:border-t-0 border-gray-100">
                                
                                <div class="text-center px-4 border-r border-gray-200 hidden sm:block">
                                    <span class="block text-2xl font-black text-gray-800">${quizResults.length}</span>
                                    <span class="text-xs text-gray-500 uppercase tracking-wide">Entregas</span>
                                </div>

                                <button onclick="window.copyStudentLink('${quiz.pin}')" class="flex-1 lg:flex-none bg-white border border-indigo-200 hover:bg-indigo-50 text-indigo-700 font-medium py-2 px-4 rounded-lg transition flex items-center justify-center gap-2">
                                    Copiar Enlace
                                </button>

                                <button onclick="window.downloadExcel('${quiz.id}', '${quiz.topic}')" ${quizResults.length === 0 ? 'disabled' : ''} class="flex-1 lg:flex-none bg-green-500 hover:bg-green-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-medium py-2 px-4 rounded-lg transition flex items-center justify-center gap-2">
                                    Descargar Excel
                                </button>

                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        window.copyStudentLink = (pin) => {
            const baseUrl = window.location.origin + window.location.pathname;
            const link = `${baseUrl}?pin=${pin}`;

            const tempInput = document.createElement("input");
            tempInput.value = link;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            showToast("Enlace de producción copiado", "success");
        };

        window.generateQuizWithAI = async () => {
            const promptInput = document.getElementById('quiz-prompt');
            const btn = document.getElementById('btn-generate');
            const topic = promptInput.value.trim();

            if (!topic) {
                showToast("Por favor describe la prueba.", "error");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `Conectando con IA...`;

            try {
                // Modelo estable público
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`;
                const systemPrompt = `Eres un creador de exámenes. Lee la solicitud del usuario y genera un quiz matemático.
                IMPORTANTE: Adapta la cantidad de preguntas EXACTAMENTE a lo que el usuario pide.
                DEVUELVE ESTRICTAMENTE JSON, SIN TEXTO ADICIONAL Y SIN ETIQUETAS COMO \`\`\`json. Estructura:
                {
                    "questions": [
                        {
                            "question": "Pregunta",
                            "options": ["A", "B", "C", "D"],
                            "correct_index": 0
                        }
                    ]
                }
                El correct_index debe ser el número (0-3) de la opción correcta.`;

                const payload = {
                    contents: [{ parts: [{ text: topic }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                };

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Error API IA");

                const data = await response.json();
                
                // Limpieza de formato de IA
                let jsonText = data.candidates[0].content.parts[0].text;
                jsonText = jsonText.replace(/```json/gi, '').replace(/```/g, '').trim();
                const quizData = JSON.parse(jsonText);

                const appId = typeof __app_id !== 'undefined' ? __app_id : 'produccion-edutest';
                const quizzesRef = collection(db, 'artifacts', appId, 'public', 'data', 'quizzes');
                const pin = Math.random().toString(36).substring(2, 6).toUpperCase();

                await addDoc(quizzesRef, {
                    topic: topic,
                    pin: pin,
                    questions: quizData.questions,
                    createdAt: Date.now()
                });

                promptInput.value = '';
                showToast("Prueba guardada en Base de Datos.", "success");

            } catch (error) {
                console.error("Detalle del Error:", error);
                showToast("Fallo en la red o IA. Intenta de nuevo.", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `Generar Prueba Oficial`;
            }
        };

        window.downloadExcel = (quizId, quizTopic) => {
            const quizResults = allResults.filter(r => r.quizId === quizId);
            
            const excelData = quizResults.map(r => ({
                'Estudiante': r.studentName,
                'Respuestas Correctas': r.score,
                'Total Preguntas': r.totalQuestions,
                'Calificación (%)': ((r.score / r.totalQuestions) * 100).toFixed(0) + '%',
                'Fecha': new Date(r.timestamp).toLocaleString()
            }));

            const ws = XLSX.utils.json_to_sheet(excelData);
            ws['!cols'] = [{wch: 30}, {wch: 20}, {wch: 15}, {wch: 15}, {wch: 25}];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Resultados");
            
            const cleanTopic = quizTopic.substring(0, 15).replace(/[^a-z0-9]/gi, '');
            XLSX.writeFile(wb, `Reporte_Oficial_${cleanTopic}.xlsx`);
        };

        // --- LÓGICA DEL ESTUDIANTE ---

        const startStudentView = () => {
            const pin = window.appState.urlPin;
            const quiz = quizzes.find(q => q.pin === pin);

            if (quiz) {
                window.appState.currentQuiz = quiz;
                navigate('student_name');
            } else if (quizzes.length > 0) {
                document.getElementById('app-content').innerHTML = `
                    <div class="max-w-md mx-auto text-center mt-20 p-6 bg-white rounded-xl shadow-lg border-t-4 border-red-500">
                        <h2 class="text-xl font-bold text-gray-800">Enlace No Válido</h2>
                        <p class="text-gray-500 mt-2">Esta prueba no se encuentra en el servidor.</p>
                    </div>
                `;
            }
        };

        window.startQuizProcess = () => {
            const name = document.getElementById('student-name-input').value.trim();
            if (!name) {
                showToast("Debes ingresar tu nombre.", "error");
                return;
            }
            window.appState.studentName = name;
            navigate('taking_quiz');
        };

        const renderTakingQuiz = (container) => {
            const quiz = window.appState.currentQuiz;
            
            let questionsHTML = quiz.questions.map((q, qIndex) => {
                const optionsHTML = q.options.map((opt, oIndex) => `
                    <label class="block p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-green-50 transition peer-checked:border-green-500 peer-checked:bg-green-50">
                        <div class="flex items-center">
                            <input type="radio" name="q_${qIndex}" value="${oIndex}" class="w-5 h-5 text-green-600 bg-gray-100 border-gray-300 focus:ring-green-500">
                            <span class="ml-4 text-gray-700 font-medium">${opt}</span>
                        </div>
                    </label>
                `).join('');

                return `
                    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100 mb-6">
                        <h3 class="text-lg font-bold text-gray-800 mb-6"><span class="text-green-500">${qIndex + 1}.</span> ${q.question}</h3>
                        <div class="space-y-3">
                            ${optionsHTML}
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="max-w-3xl mx-auto animate-fade-in pb-10">
                    <div class="bg-green-600 text-white p-6 rounded-2xl shadow-lg mb-8 flex flex-col sm:flex-row justify-between items-center gap-4 sticky top-4 z-20">
                        <div>
                            <h2 class="text-xl font-bold">${quiz.topic}</h2>
                        </div>
                        <div class="bg-white/20 px-4 py-2 rounded-lg font-bold backdrop-blur-sm">
                            ${window.appState.studentName}
                        </div>
                    </div>

                    <form id="quiz-form" onsubmit="event.preventDefault(); window.submitQuiz();">
                        ${questionsHTML}
                        
                        <button type="submit" id="btn-submit-quiz" class="w-full mt-4 bg-gray-800 hover:bg-gray-900 text-white font-bold py-5 rounded-2xl shadow-xl transition transform hover:scale-[1.02] text-xl">
                            Enviar y Finalizar Prueba
                        </button>
                    </form>
                </div>
            `;
        };

        window.submitQuiz = async () => {
            const quiz = window.appState.currentQuiz;
            const form = document.getElementById('quiz-form');
            const btn = document.getElementById('btn-submit-quiz');
            let score = 0;

            for (let i = 0; i < quiz.questions.length; i++) {
                const selected = form.elements[`q_${i}`].value;
                if (selected === "") {
                    showToast(`Responde la pregunta ${i + 1}`, "error");
                    return;
                }
                if (parseInt(selected) === quiz.questions[i].correct_index) {
                    score++;
                }
            }

            btn.disabled = true;
            btn.innerHTML = `Enviando a la base de datos...`;

            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'produccion-edutest';
                const resultsRef = collection(db, 'artifacts', appId, 'public', 'data', 'results');
                
                await addDoc(resultsRef, {
                    quizId: quiz.id,
                    studentName: window.appState.studentName,
                    score: score,
                    totalQuestions: quiz.questions.length,
                    timestamp: Date.now()
                });

                window.appState.studentScore = score;
                navigate('quiz_result');

            } catch (error) {
                console.error(error);
                showToast("Error de conexión al enviar.", "error");
                btn.disabled = false;
                btn.innerHTML = `Enviar y Finalizar Prueba`;
            }
        };

        // --- UTILIDADES ---
        const showToast = (message, type = 'info') => {
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-500' : 'bg-green-500';
            toast.className = `fixed bottom-6 left-1/2 transform -translate-x-1/2 ${bgColor} text-white px-6 py-3 rounded-full shadow-2xl font-medium z-50 transition-all duration-300 translate-y-10 opacity-0`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.onload = () => {
            initFirebase();
            checkRouting();
        };

    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    
    <header class="bg-white shadow-sm border-b border-gray-100 z-30">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-center">
            <h1 class="text-xl font-black text-gray-800">EduTest <span class="text-indigo-600">Pro</span></h1>
        </div>
    </header>

    <main id="app-content" class="flex-grow w-full px-4 py-8 relative">
        <!-- Contenido -->
    </main>

</body>
</html>
